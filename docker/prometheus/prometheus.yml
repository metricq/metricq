global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: docker-host
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: metricq-gombinator
    static_configs:
      - targets:
          - metricq-gombinator:8080

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq-server:15692

  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_consumer_count
    static_configs:
      - targets:
          - rabbitmq-server:15692
    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: rabbitmq_detailed_queue_(messages|messages_ready|messages_unacked|consumers)
        action: keep

  - job_name: couchdb
    metrics_path: /_node/_local/_prometheus
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets:
          - couchdb-server:5984
